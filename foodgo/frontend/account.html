<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — FoodGo</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="topbar"></div>
  <div class="container" style="padding-top:32px; padding-bottom:48px;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>My Orders</h1>
      <button class="btn btn-outline" id="signOutBtn">Sign out</button>
    </div>
    <div id="orderHistory" style="margin-top:24px; display:flex; flex-direction:column; gap:16px;">
      <p>Loading your orders…</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/header.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
